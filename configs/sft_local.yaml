# Stage 1 — LoRA SFT, tuned for CPU-only local training (no CUDA)
# Measured ~X s/step on i5-1340P (see README "Local CPU training").
model_id: Qwen/Qwen2.5-0.5B-Instruct
seed: 42
train_file: data/sft/train.jsonl
val_file: data/sft/val.jsonl
output_dir: runs/sft_local
max_steps: 150          # ~9 min/step measured on i5-1340P CPU → ~22 h
resume: true            # pick up from runs/sft_local/checkpoint-* if interrupted
lr: 0.0003
batch_size: 1
grad_accum: 16          # effective batch 16
eval_steps: 50
eval_limit: 8           # tiny eval set: CPU eval is expensive
max_seq_len: 1024
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
