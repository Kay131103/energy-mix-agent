# Stage 2 — GRPO on the BILL task, tuned for CPU-only local training.
# Bill completions are ~80 tokens, so CPU rollouts stay tractable.
# (The 12-hour plan task needs ~512-token generations — do that one on Colab.)
model_id: Qwen/Qwen2.5-0.5B-Instruct
adapter_dir: runs/sft_local/adapter   # continue from the local SFT adapter ("" = base)
task: bill
prompts_file: data/grpo/prompts.jsonl
output_dir: runs/grpo_local
seed: 42
epochs: 1
max_steps: 40
resume: true            # pick up from runs/grpo_local/checkpoint-* if interrupted
lr: 0.00005
batch_size: 2          # must be divisible by num_generations
grad_accum: 8
num_generations: 2
max_prompt_tokens: 512
max_completion_tokens: 160
temperature: 0.9
beta: 0.001
save_steps: 20
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
