# Stage 2 — GRPO on the BILL task, CPU-only local training (v4: gentle LR).
# v3 used lr 5e-5 → KL blew up (~1e8) and bill reward DROPPED below SFT.
# 5e-6 keeps the policy near SFT while still squeezing the verifiable reward.
model_id: Qwen/Qwen2.5-0.5B-Instruct
adapter_dir: runs/sft_local/adapter   # start GRPO from the fresh SFT v2 checkpoint
task: bill
prompts_file: data/grpo/prompts.jsonl
output_dir: runs/grpo_local
seed: 42
epochs: 1
max_steps: 30
resume: true            # pick up from runs/grpo_local/checkpoint-* if interrupted
lr: 0.000005
batch_size: 2          # must be divisible by num_generations
grad_accum: 8
num_generations: 2
max_prompt_tokens: 512
max_completion_tokens: 160
temperature: 0.9
beta: 0.001
save_steps: 15
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
