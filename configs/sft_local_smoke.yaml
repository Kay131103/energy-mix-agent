# 3-step smoke test to measure CPU step time (not for real training)
model_id: Qwen/Qwen2.5-0.5B-Instruct
seed: 42
train_file: data/sft/train.jsonl
val_file: data/sft/val.jsonl
output_dir: runs/sft_smoke
max_steps: 3
lr: 0.0003
batch_size: 1
grad_accum: 16
eval_steps: 100
eval_limit: 2
max_seq_len: 1024
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
